name: OI snapshot -> Pages

# «хронометр» GitHub: по расписанию собираем снимок скринера и публикуем на GitHub Pages.
# Токен MOEX берётся из секрета ALGOPACK_TOKEN (в код/сайт не попадает).
on:
  schedule:
    # каждые 15 мин в часы торгов MOEX (07:00–20:00 МСК = 04:00–17:00 UTC), пн–пт.
    # cron в UTC; расписание GitHub — «по возможности», возможны задержки в пик нагрузки.
    - cron: "*/15 4-17 * * 1-5"
  workflow_dispatch: {}   # кнопка «Run workflow» для ручного запуска

# Pages деплоится из АРТЕФАКТА, а не из коммитов -> история репозитория не пухнет.
permissions:
  contents: read
  pages: write
  id-token: write

# не запускать параллельно; свежий прогон отменяет предыдущий
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Собрать снимок
        env:
          ALGOPACK_TOKEN: ${{ secrets.ALGOPACK_TOKEN }}
          OI_NO_BROWSER: "1"
        run: python build_snapshot.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
